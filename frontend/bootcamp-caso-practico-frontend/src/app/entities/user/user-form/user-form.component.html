<div class="container-fluid">
    <h1>{{mode}}</h1>
    <form *ngIf="user" #userForm="ngForm" name="userForm" role="form" novalidate autocomplete="off">
        <div class="form-group">
            <label for="id">Id</label>
            <input type="number" [(ngModel)]="user.id" name="id" class="form-control" id="id" #id="ngModel" disabled="true">
        </div>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" [(ngModel)]="user.name" name="name" class="form-control" id="name" #name="ngModel">
        </div>
        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" [(ngModel)]="user.lastName" name="lastName" class="form-control" id="lastName" #lastName="ngModel">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" [(ngModel)]="user.email" name="email" class="form-control" id="email" #email="ngModel">
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select class="form-select" [(ngModel)]="user.roleId" name="roleName" id="role" #role="ngModel">
                <option value="0" disabled selected>Select a role</option>
                <option *ngFor="let role of roles" [value]="role.id">{{role.name}}</option>
            </select>
        </div>
        <div class="form-group">
            <label for="rowVersion">Row Version</label>
            <input type="text" [(ngModel)]="user.rowVersion" name="rowVersion" class="form-control" id="rowVersion" #rowVersion="ngModel" disabled="true">
        </div>
    </form>
    <div class="buttons-form">
        <button class="btn btn-secondary save-btn" (click)="saveUser()">Save</button>
        <button class="btn btn-secondary cancel-btn" data-bs-toggle="modal" data-bs-target="#cancel-modal">Cancel</button>
    </div>
</div>

<div class="modal fade" id="cancel-modal" tabindex="-1" aria-labelledby="cancel-modal" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="cancel-modal">Are you sure?</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            Are you sure you want to cancel this action? The chages made will be lost.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="goBack()">Confirm</button>
        </div>
      </div>
    </div>
  </div>
